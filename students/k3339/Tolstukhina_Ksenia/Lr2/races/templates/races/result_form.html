{% extends "base.html" %}
{% block title %}Добавить результат{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card bg-body-tertiary border-secondary"><div class="card-body p-4">
    <h3 class="mb-4">Добавить результат</h3>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
        </div>
      {% endfor %}
      <div class="d-flex gap-2">
        <button class="btn btn-primary">Добавить</button>
        <a href="{% url 'races:race_detail' view.race.pk %}" class="btn btn-secondary">Назад</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
{% block scripts %}
<script>
  const userSel = document.getElementById('id_user');
  if (userSel) {
    userSel.addEventListener('change', () => {
      const url = new URL(window.location);
      url.searchParams.set('user', userSel.value);
      window.location = url;
    });
  }
</script>
{% endblock %}
