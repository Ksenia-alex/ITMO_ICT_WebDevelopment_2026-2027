{% extends "base.html" %}
{% block title %}Профиль — редактирование{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card bg-body-tertiary border-secondary"><div class="card-body p-4">
    <h3 class="mb-4">Редактирование профиля</h3>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
        </div>
      {% endfor %}
      <div class="d-flex gap-2">
        <button class="btn btn-primary">Сохранить</button>
        <a href="{% url 'races:profile' %}" class="btn btn-secondary">Отмена</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
